<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>DrScheme Web</title>
<meta name="description" content="A Scheme (R7RS) environment in your browser, inspired by DrRacket.">
<meta name="theme-color" content="#14161b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f8cff'/%3E%3Ctext x='16' y='23.5' font-size='21' text-anchor='middle' fill='white' font-family='Georgia,serif'%3E%CE%BB%3C/text%3E%3C/svg%3E">
<script>
  // Apply the saved theme before the page paints (dark by default).
  try {
    var s = JSON.parse(localStorage.getItem('drscheme-web:v1'));
    document.documentElement.dataset.theme = (s && s.prefs && s.prefs.theme) || 'dark';
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="stylesheet" href="dist/app.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div class="brand"><span class="logo" aria-hidden="true">λ</span><span class="brand-name">DrScheme</span></div>
    <nav id="menubar" aria-label="Menus"></nav>
    <div class="actions">
      <button id="theme-btn" class="icon-btn" title="Toggle dark / light mode" aria-label="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
      <span class="divider"></span>
      <button id="check-btn" class="icon-btn" title="Check Syntax (Shift+Ctrl+K)" aria-label="Check syntax">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M7.5 10.5l2 2 3.5-4"/></svg>
      </button>
      <button id="debug-btn" class="icon-btn" title="Debug" aria-label="Debug">
        <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="13" rx="5"/><path d="M9 7.5a3 3 0 0 1 6 0M12 11v9M3 13h4M17 13h4M4 7l3.2 2.5M20 7l-3.2 2.5M4 20l3.2-2.5M20 20l-3.2-2.5"/></svg>
      </button>
      <button id="macro-btn" class="icon-btn" title="Macro Stepper" aria-label="Macro stepper">
        <svg viewBox="0 0 24 24"><path d="M12 3.5l9 16.5H3z"/><path d="M10 11v5M14 11v5M8.5 12.5h7M8.5 14.5h7"/></svg>
      </button>
      <button id="run-btn" class="run-btn" title="Run (Ctrl+R)">
        <svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>
        <span>Run</span>
      </button>
      <button id="stop-btn" class="stop-btn" title="Stop (Ctrl+B)" aria-label="Stop">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span>Stop</span>
      </button>
    </div>
  </header>

  <div id="tabrow">
    <div id="tabs" role="tablist"></div>
    <button id="open-btn" class="chip" title="Open a file (Ctrl+O)"><svg viewBox="0 0 16 16" class="chip-icon"><path d="M1.5 4.5v8a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H8L6.5 3h-4a1 1 0 0 0-1 1.5z"/></svg>Open</button>
    <button id="define-btn" class="chip" title="Jump to a definition"><code>(define ...)</code> <span class="caret">▾</span></button>
  </div>

  <main id="panes" class="dock-right">
    <div id="dock-overlay" hidden><div class="zone"></div></div>
    <section id="defs-wrap" class="pane">
      <div id="defs" aria-label="Definitions window"></div>
    </section>
    <div id="splitter" title="Drag to resize"><span></span></div>
    <section id="inter-wrap" class="pane" aria-label="Interactions window">
      <div class="pane-head" id="inter-head" title="Drag this bar to an edge of the window to move the interactions">
        <span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><circle cx="2.5" cy="3" r="1.3"/><circle cx="7.5" cy="3" r="1.3"/><circle cx="2.5" cy="8" r="1.3"/><circle cx="7.5" cy="8" r="1.3"/><circle cx="2.5" cy="13" r="1.3"/><circle cx="7.5" cy="13" r="1.3"/></svg></span>
        <span class="pane-title">Interactions</span>
        <span class="spacer"></span>
        <div id="dock-btns" role="group" aria-label="Interactions position">
          <button data-dock="left" title="Put interactions on the left" aria-label="Left"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><rect class="fill" x="2.5" y="3.5" width="4.5" height="9" rx="1"/></svg></button>
          <button data-dock="top" title="Put interactions on top" aria-label="Top"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><rect class="fill" x="2.5" y="3.5" width="11" height="4" rx="1"/></svg></button>
          <button data-dock="bottom" title="Put interactions at the bottom" aria-label="Bottom"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><rect class="fill" x="2.5" y="8.5" width="11" height="4" rx="1"/></svg></button>
          <button data-dock="right" title="Put interactions on the right" aria-label="Right"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><rect class="fill" x="9" y="3.5" width="4.5" height="9" rx="1"/></svg></button>
        </div>
        <button id="clear-btn" class="link-btn" title="Clear the interactions window">Clear</button>
      </div>
      <div id="inter">
        <div id="log"></div>
        <div id="prompt-row"><span class="prompt">&gt;</span><div id="input"></div></div>
      </div>
    </section>
  </main>

  <footer id="statusbar">
    <button id="lang-btn" class="chip" title="Choose language (Ctrl+L)"><span class="dot"></span><span id="lang-btn-label"></span> <span class="caret">▾</span></button>
    <span id="status-msg"></span>
    <span class="spacer"></span>
    <span id="pos">1:0</span>
    <span id="run-indicator" title="Idle"></span>
  </footer>
</div>

<div id="menu-popup" hidden></div>

<div id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-title"></div>
    <div class="modal-body"></div>
    <div class="modal-buttons"></div>
  </div>
</div>

<!-- No "accept" filter: iPhone/iPad Safari greys out unknown extensions such as .rkt -->
<input type="file" id="open-file" multiple hidden>
<script src="dist/app.js"></script>
</body>
</html>
